name: watch

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TZ: Europe/Brussels
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      ALERT_TO: ${{ secrets.ALERT_TO }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check Immoweb
        run: python3 watch.py
      - name: Save state
        if: always()
        run: |
          git config user.name "immoweb-watch"
          git config user.email "gregdelaunoit@gmail.com"
          git add seen.json
          if git diff --cached --quiet; then echo "nothing to save"; exit 0; fi
          git commit -m "state $(date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
